<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("speedShopTheme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سلتي — SPEED SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D1A;
    --surface:#12162A;
    --surface-2:#1A1F3A;
    --line:#262C4A;
    --text:#F2F3F8;
    --text-dim:#9BA0C0;
    --accent:#3D5CFF;
    --accent-2:#00D9C0;
    --coral:#FF6A3D;
    --gold:#FFB020;
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:24px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Cairo', sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-bottom:calc(64px + var(--safe-bottom));
  }
  img{max-width:100%; display:block;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; border:none; cursor:pointer; color:inherit; background:none;}
  ::selection{background:var(--accent); color:#fff;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .wrap{max-width:900px; margin:0 auto; padding:0 16px;}

  /* ===== HEADER (same system as home) ===== */
  header.top{
    position:sticky; top:0; z-index:50;
    background:rgba(10,13,26,0.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .top-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); flex-shrink:0;
  }
  .page-title{font-weight:800; font-size:1.05rem;}
  .page-title small{display:block; font-size:0.7rem; font-weight:500; color:var(--text-dim); margin-top:1px;}
  .top-spacer{margin-inline-start:auto;}
  .clear-btn{font-size:0.8rem; color:var(--coral); font-weight:700;}

  /* ===== STEPS ===== */
  .steps{display:flex; align-items:center; gap:6px; padding:12px 16px 4px;}
  .step{display:flex; align-items:center; gap:6px; font-size:0.72rem; color:var(--text-dim); font-weight:700;}
  .step .dot{width:22px; height:22px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:0.72rem;}
  .step.active{color:var(--accent-2);}
  .step.active .dot{background:var(--accent-2); border-color:var(--accent-2); color:#06251f; font-weight:800;}
  .step-line{flex:1; height:1px; background:var(--line); min-width:14px;}

  main{padding-top:8px;}

  /* ===== STORE GROUP ===== */
  .store-group{margin:18px 16px 0;}
  .store-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .store-head .em{font-size:1rem;}
  .store-head h3{font-size:0.88rem; font-weight:800;}
  .store-head span{font-size:0.72rem; color:var(--text-dim); margin-inline-start:auto;}

  .cart-item{
    display:flex; gap:12px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:12px; margin-bottom:10px;
    transition:transform .2s ease, opacity .2s ease;
  }
  .cart-item.removing{transform:translateX(40px); opacity:0;}
  .ci-media{
    width:72px; height:72px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(135deg, var(--surface-2), #10142A);
    display:flex; align-items:center; justify-content:center; font-size:1.8rem;
  }
  .ci-body{flex:1; min-width:0; display:flex; flex-direction:column;}
  .ci-name{font-size:0.86rem; font-weight:700; margin-bottom:2px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .ci-variant{font-size:0.72rem; color:var(--text-dim); margin-bottom:8px;}
  .ci-row{display:flex; align-items:center; justify-content:space-between; margin-top:auto; gap:8px;}
  .ci-price{font-weight:800; font-size:0.92rem; color:var(--accent-2);}
  .ci-old{font-size:0.7rem; color:var(--text-dim); text-decoration:line-through; margin-inline-start:6px; font-weight:600;}
  .stepper{display:flex; align-items:center; gap:0; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .stepper button{width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-size:1rem; font-weight:800; color:var(--text);}
  .stepper button:active{background:rgba(255,255,255,0.06);}
  .stepper .qty{width:26px; text-align:center; font-size:0.84rem; font-weight:700; font-variant-numeric:tabular-nums;}
  .ci-actions{display:flex; flex-direction:column; align-items:center; justify-content:space-between;}
  .ci-remove{width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--text-dim);}
  .ci-remove:active{color:var(--coral);}
  .ci-save{font-size:0.66rem; color:var(--text-dim); text-decoration:underline; text-underline-offset:2px;}

  /* ===== SAVED FOR LATER ===== */
  .saved-toggle{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); margin:18px 16px 0; font-size:0.85rem; font-weight:700;
  }
  .saved-toggle .chev{transition:transform .25s ease; color:var(--text-dim);}
  .saved-toggle.open .chev{transform:rotate(180deg);}
  .saved-list{max-height:0; overflow:hidden; transition:max-height .3s ease; margin:0 16px;}
  .saved-list.open{max-height:600px; margin-top:10px;}
  .saved-item{
    display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:10px 12px; margin-bottom:8px;
  }
  .saved-item .ci-media{width:52px; height:52px; font-size:1.4rem;}
  .saved-item .ci-name{font-size:0.8rem; margin-bottom:4px;}
  .saved-item .ci-price{font-size:0.82rem;}
  .saved-restore{
    font-size:0.72rem; font-weight:700; color:var(--accent-2); border:1px solid var(--accent-2);
    border-radius:8px; padding:6px 10px; white-space:nowrap; flex-shrink:0;
  }

  /* ===== PROMO ===== */
  .promo-box{
    margin:18px 16px 0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:12px; display:flex; gap:8px;
  }
  .promo-box input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:inherit; font-size:0.85rem; outline:none;
  }
  .promo-box input::placeholder{color:var(--text-dim);}
  .promo-apply{
    background:var(--accent); color:#fff; font-weight:700; font-size:0.82rem;
    padding:0 16px; border-radius:10px; white-space:nowrap;
  }
  .promo-apply:disabled{opacity:0.5;}
  .promo-msg{font-size:0.74rem; margin-top:8px; display:none;}
  .promo-msg.ok{display:block; color:var(--accent-2);}
  .promo-msg.err{display:block; color:var(--coral);}

  /* ===== SUMMARY ===== */
  .summary{
    margin:18px 16px 0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius-lg); padding:16px;
  }
  .summary h3{font-size:0.92rem; font-weight:800; margin-bottom:12px;}
  .sum-row{display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-dim); margin-bottom:9px;}
  .sum-row b{color:var(--text); font-weight:600;}
  .sum-row.discount b{color:var(--accent-2);}
  .sum-divider{height:1px; background:var(--line); margin:10px 0;}
  .sum-total{display:flex; justify-content:space-between; align-items:baseline; font-weight:800;}
  .sum-total span{font-size:0.92rem;}
  .sum-total b{font-size:1.3rem; color:var(--accent-2);}

  /* ===== EMPTY STATE ===== */
  .empty-state{
    display:none; flex-direction:column; align-items:center; text-align:center;
    padding:60px 24px; gap:6px;
  }
  .empty-state .em{font-size:3rem; margin-bottom:10px; opacity:0.7;}
  .empty-state h3{font-size:1.1rem; font-weight:800;}
  .empty-state p{font-size:0.85rem; color:var(--text-dim); max-width:32ch; margin-bottom:20px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 20px; border-radius:14px; font-weight:700; font-size:0.92rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(90deg, var(--accent), #5A78FF); color:#fff;
    box-shadow:0 8px 24px -8px rgba(61,92,255,0.6);
  }
  .btn-ghost{background:var(--surface); border:1px solid var(--line); color:var(--text);}

  /* ===== CHECKOUT BAR ===== */
  .checkout-bar{
    position:fixed; bottom:0; right:0; left:0; z-index:70;
    background:rgba(18,22,42,0.97); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding:12px 16px calc(12px + var(--safe-bottom));
    display:flex; align-items:center; gap:12px;
  }
  .checkout-bar .cb-total{flex:1; min-width:0;}
  .checkout-bar .cb-total span{display:block; font-size:0.68rem; color:var(--text-dim);}
  .checkout-bar .cb-total b{font-size:1.15rem; color:var(--accent-2); font-variant-numeric:tabular-nums;}
  .checkout-bar .btn{flex-shrink:0; padding:13px 22px;}

  body{padding-bottom:calc(150px + var(--safe-bottom));}

  /* ===== TABLET / DESKTOP ===== */
  @media (min-width:900px){
    .store-group, .promo-box, .summary, .saved-toggle{margin-inline:0;}
    .wrap-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:24px; align-items:start; padding:0 16px;}
    .checkout-bar{position:static; background:none; backdrop-filter:none; border:none; padding:0; margin-top:18px;}
    .checkout-bar .cb-total{display:none;}
    .checkout-bar .btn{width:100%;}
    body{padding-bottom:24px;}
    .steps{padding:18px 16px 4px;}
  }

  /* ===== LIGHT THEME (DAY MODE) ===== */
  html[data-theme="light"]{
    --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EEF1F8; --line:#E1E5F0;
    --text:#12162A; --text-dim:#667085; --accent:#3D5CFF; --accent-2:#0E9C87;
    --coral:#D14722; --gold:#B8790A;
  }
  html[data-theme="light"] header.top{background:rgba(255,255,255,0.86); box-shadow:0 1px 0 var(--line);}
  html[data-theme="light"] .bottom-nav{background:rgba(255,255,255,0.92);}
  html[data-theme="light"] .checkout-bar{background:rgba(255,255,255,0.92);}
  html[data-theme="light"] .bottom-bar{background:rgba(255,255,255,0.92);}
  html[data-theme="light"] .success-overlay{background:rgba(244,246,251,0.95);}
  html[data-theme="light"] .map-eta{background:rgba(255,255,255,0.92);}
  html[data-theme="light"] .ci-media,
  html[data-theme="light"] .p-media,
  html[data-theme="light"] .rider-avatar,
  html[data-theme="light"] .fav-media{background:linear-gradient(135deg, var(--surface-2), #E2E7F5);}
  html[data-theme="light"] .drawer{box-shadow:-8px 0 30px -10px rgba(20,30,60,0.15);}

  /* theme toggle icon swap */
  .theme-toggle .icon-moon{display:none;}
  .theme-toggle .icon-sun{display:flex;}
  html[data-theme="light"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="light"] .theme-toggle .icon-moon{display:flex;}

  /* ============================================================
     MOTION & INTERACTION SYSTEM — unified across the app
     (added: does not change layout, branding or functionality)
     ============================================================ */
  :root{
    --m-ease-out:cubic-bezier(.16,1,.3,1);
    --m-ease-in:cubic-bezier(.7,0,.84,0);
    --m-ease-in-out:cubic-bezier(.65,0,.35,1);
    --m-spring:cubic-bezier(.34,1.56,.64,1);
    --m-fast:140ms; --m-base:220ms; --m-slow:320ms;
    --m-scroll-ease:cubic-bezier(.22,1,.36,1); --m-scroll-dur:520ms;
    --m-reveal-dist:20px;
  }

  /* ---- buttons & tappable controls ---- */
  .icon-btn, .btn, .btn-primary, .btn-ghost, .btn-outline, .btn-coral,
  .fav-add, .clear-btn, .edit-btn, .promo-apply, .form-save-btn, .add-addr-btn,
  .hamburger-btn, .p-add, .p-fav, .call, .drawer-close, .fav-remove,
  .saved-restore, .top-fab, .sum-items-toggle, .saved-toggle, .ci-remove,
  .ci-save, .discount, .qty button, .rider-actions a, .swatch, .chip{
    transition:transform var(--m-fast) var(--m-ease-out),
               box-shadow var(--m-fast) var(--m-ease-out),
               background-color var(--m-fast) var(--m-ease-out),
               border-color var(--m-fast) var(--m-ease-out),
               color var(--m-fast) var(--m-ease-out),
               opacity var(--m-fast) var(--m-ease-out) !important;
    will-change:transform;
  }
  @media (hover:hover){
    .icon-btn:hover, .btn:hover, .btn-primary:hover, .btn-ghost:hover, .btn-outline:hover, .btn-coral:hover,
    .fav-add:hover:not(:disabled), .edit-btn:hover, .promo-apply:hover, .form-save-btn:hover, .add-addr-btn:hover,
    .p-add:hover, .call:hover, .top-fab:hover, .saved-restore:hover, .swatch:hover, .chip:hover{
      transform:translateY(-1px) scale(1.02);
      box-shadow:0 8px 18px -8px rgba(0,0,0,.35);
    }
    .order-card:hover, .rp-card:hover, .addr-card:hover, .why-card:hover, .t-card:hover,
    .p-card:hover, .stat-card:hover, .rider-card:hover, .map-card:hover{
      transform:translateY(-3px);
      border-color:var(--accent);
      box-shadow:0 14px 28px -16px rgba(0,0,0,.4);
    }
    .menu-row:hover, .pay-option:hover, .drawer-link:hover, .faq-item:hover, .addr-card:hover{
      background-color:var(--surface-2);
    }
  }
  .icon-btn:active, .btn:active, .btn-primary:active, .btn-ghost:active, .btn-outline:active, .btn-coral:active,
  .fav-add:active, .clear-btn:active, .edit-btn:active, .promo-apply:active, .form-save-btn:active,
  .add-addr-btn:active, .hamburger-btn:active, .p-add:active, .p-fav:active, .call:active,
  .drawer-close:active, .fav-remove:active, .top-fab:active, .menu-row:active, .pay-option:active,
  .drawer-link:active, .lang-pill:active, .tab:active, .tabbtn:active, .swatch:active, .chip:active,
  .cat-card:active, .order-card:active, .rp-card:active, .fav-card:active, .addr-card:active, .p-card:active{
    transform:scale(.97) !important;
    transition-duration:90ms !important;
  }

  /* ---- cards ---- */
  .cat-card, .order-card, .rp-card, .fav-card, .addr-card, .rider-card, .map-card, .why-card, .t-card,
  .cart-item, .saved-item, .p-card, .stat-card{
    transition:transform var(--m-base) var(--m-ease-out),
               box-shadow var(--m-base) var(--m-ease-out),
               border-color var(--m-base) var(--m-ease-out) !important;
    will-change:transform;
  }

  /* ---- rows, tabs, pills, chips ---- */
  .menu-row, .pay-option, .oc-head, .drawer-link, .faq-item, .lang-pill, .tab, .tabbtn,
  .swatch, .chip, .oc-store-chip{
    transition:background-color var(--m-fast) var(--m-ease-out),
               color var(--m-fast) var(--m-ease-out),
               border-color var(--m-fast) var(--m-ease-out),
               transform var(--m-fast) var(--m-ease-out) !important;
  }

  /* ---- stepper / progress dots ---- */
  .dot, .step .dot, .step-line, .step, .gdot, .tl-dot, .tl-line{
    transition:background-color var(--m-base) var(--m-ease-in-out),
               border-color var(--m-base) var(--m-ease-in-out),
               color var(--m-base) var(--m-ease-in-out),
               width var(--m-base) var(--m-ease-in-out),
               transform var(--m-base) var(--m-ease-in-out) !important;
  }

  /* ---- toggle switches ---- */
  .switch{transition:background-color var(--m-base) var(--m-ease-in-out), border-color var(--m-base) var(--m-ease-in-out) !important;}
  .switch::after{transition:transform var(--m-base) var(--m-spring) !important;}

  /* ---- toast ---- */
  .toast{transition:opacity var(--m-base) var(--m-ease-out), transform var(--m-base) var(--m-spring) !important;}

  /* ---- drawer / overlays ---- */
  .drawer-overlay{transition:opacity var(--m-base) var(--m-ease-out) !important;}
  .drawer{transition:transform var(--m-slow) var(--m-ease-out) !important;}
  .drawer-link{transform:translateX(0);}

  /* ---- accordions (max-height panels) ---- */
  .saved-list, .sum-items{transition:max-height var(--m-slow) var(--m-ease-in-out) !important;}
  .saved-toggle .chev{transition:transform var(--m-base) var(--m-ease-in-out) !important;}

  /* ---- inline validation / promo messages ---- */
  .promo-msg.ok, .promo-msg.err, .field-err{animation:m-fade-up var(--m-fast) var(--m-ease-out);}

  /* ---- tab panel crossfade ---- */
  .tabpanel.active{animation:m-fade-up var(--m-base) var(--m-ease-out);}
  .gallery-slide{transition:opacity var(--m-base) var(--m-ease-out) !important;}

  /* ---- success / confirmation modal ---- */
  .success-overlay.open{animation:m-fade-in var(--m-base) var(--m-ease-out);}
  .success-card{animation:m-modal-in var(--m-slow) var(--m-ease-out) !important;}

  /* ---- reveal-on-scroll (generic, used by .reveal + .m-reveal) ---- */
  .reveal, .m-reveal{
    opacity:0; transform:translateY(var(--m-reveal-dist));
    transition:opacity var(--m-scroll-dur) var(--m-scroll-ease), transform var(--m-scroll-dur) var(--m-scroll-ease) !important;
    will-change:transform, opacity;
  }
  .reveal.in, .m-reveal.in{opacity:1; transform:translateY(0) translateX(0);}

  /* directional variants for scroll-reveal — assigned automatically by JS for visual variety */
  .m-reveal-d{transform:translateY(calc(var(--m-reveal-dist) * -1));}
  .m-reveal-l{transform:translateX(calc(var(--m-reveal-dist) * -1.6));}
  .m-reveal-r{transform:translateX(calc(var(--m-reveal-dist) * 1.6));}

  /* icon pop-in: small scale + fade for decorative icons inside revealed cards */
  .m-icon-pop{
    opacity:0; transform:scale(0.8);
    transition:opacity var(--m-base) var(--m-ease-out), transform var(--m-base) var(--m-spring) !important;
    display:inline-block; will-change:transform, opacity;
  }
  .m-icon-pop.in{opacity:1; transform:scale(1);}

  @media (max-width:640px){
    :root{ --m-reveal-dist:12px; --m-scroll-dur:380ms; }
  }

  /* ---- list add/remove ---- */
  .fav-card.removing, .cart-item.removing, .order-card.removing, .saved-item.removing{
    transition:transform var(--m-base) var(--m-ease-in), opacity var(--m-base) var(--m-ease-in) !important;
  }
  .m-enter{animation:m-fade-up var(--m-base) var(--m-ease-out);}

  @keyframes m-fade-up{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes m-fade-in{from{opacity:0;} to{opacity:1;}}
  @keyframes m-modal-in{from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);}}
  @keyframes m-nav-in{from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:translateY(0);}}
  @keyframes m-body-in{from{opacity:0;} to{opacity:1;}}

  /* ---- page load: navbar entrance + whole-page fade-in ---- */
  header.top{animation:m-nav-in .55s var(--m-ease-out) both;}
  body{animation:m-body-in var(--m-slow) var(--m-ease-out) both;}

  /* ---- page-to-page transition: fade the current page out before navigating away ---- */
  body.m-page-exit{opacity:0 !important; transition:opacity 180ms var(--m-ease-in) !important; pointer-events:none;}

  /* ---- slim top loading indicator (only shown briefly while a page navigation is in flight) ---- */
  .m-loadbar{
    position:fixed; top:0; right:0; left:0; height:2.5px; z-index:999;
    background:linear-gradient(90deg, var(--accent-2), var(--accent));
    transform:scaleX(0); transform-origin:right;
    opacity:0; pointer-events:none;
    transition:transform .45s var(--m-ease-out), opacity .2s var(--m-ease-out);
  }
  .m-loadbar.show{opacity:1; transform:scaleX(.72);}
  .m-loadbar.done{opacity:0; transform:scaleX(1); transition:transform .2s var(--m-ease-out), opacity .3s ease .15s;}

  /* ---- scroll progress bar: fills as the user scrolls down the page ---- */
  .m-scrollbar{
    position:fixed; top:0; right:0; left:0; height:2.5px; z-index:997; pointer-events:none;
    background:rgba(128,128,128,0.12);
  }
  .m-scrollbar-fill{
    height:100%; width:100%; transform:scaleX(0); transform-origin:right;
    background:linear-gradient(90deg, var(--accent-2), var(--accent));
    transition:transform 80ms linear;
    will-change:transform;
  }

  /* ---- hero parallax: background media + decorative glows drift slightly vs. scroll ---- */
  .hero{ --pz:0px; }
  .hero-media-wrap img{ transform:translate(-50%,-50%) translateY(var(--pz,0px)) !important; }
  .hero::before{ transform:translateY(calc(var(--pz,0px) * 0.7)); }
  .hero::after{ transform:translateY(calc(var(--pz,0px) * -0.7)); }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important; animation-iteration-count:1 !important;
      transition-duration:0.01ms !important; scroll-behavior:auto !important;
    }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="top">
  <div class="top-row">
    <a class="icon-btn" href="speed-shop.html" aria-label="رجوع">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="16 4 8 12 16 20"/></svg>
    </a>
    <div class="page-title">سلة المشتريات<small id="itemCountLabel">0 منتج</small></div>
    <div class="top-spacer"></div>
    <button class="icon-btn theme-toggle" id="themeToggle" aria-label="الوضع الليلي/النهاري">
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    
    <button class="clear-btn" id="clearCartBtn">إفراغ السلة</button>
  </div>
  <div class="steps">
    <div class="step active"><span class="dot">1</span> السلة</div>
    <div class="step-line"></div>
    <div class="step"><span class="dot">2</span> العنوان</div>
    <div class="step-line"></div>
    <div class="step"><span class="dot">3</span> الدفع</div>
  </div>
</header>

<main>
  <div class="wrap-grid">
    <div id="cartContent">
      <!-- store groups injected by JS -->

      <div class="saved-toggle" id="savedToggle">
        <span>📌 محفوظ لوقت لاحق (<span id="savedCount">0</span>)</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="saved-list" id="savedList"></div>

      <div class="promo-box">
        <input type="text" id="promoInput" placeholder="أدخل كود الخصم">
        <button class="promo-apply" id="promoApplyBtn">تطبيق</button>
      </div>
      <div class="promo-msg" id="promoMsg"></div>

      <div class="empty-state" id="emptyState">
        <span class="em">🛒</span>
        <h3>سلتك فارغة</h3>
        <p>لم تُضِف أي منتجات بعد. تصفّح المتجر واكتشف أفضل العروض.</p>
        <a class="btn btn-primary" href="speed-shop.html">🛍️ ابدأ التسوق</a>
      </div>
    </div>

    <div class="summary" id="summaryBox">
      <h3>ملخص الطلب</h3>
      <div class="sum-row"><span>المجموع الفرعي</span><b id="sumSubtotal">0₪</b></div>
      <div class="sum-row"><span>رسوم التوصيل</span><b id="sumDelivery">0₪</b></div>
      <div class="sum-row discount" id="sumDiscountRow" style="display:none;"><span>الخصم</span><b id="sumDiscount">-0₪</b></div>
      <div class="sum-divider"></div>
      <div class="sum-total"><span>الإجمالي</span><b id="sumTotal">0₪</b></div>
    </div>
  </div>
</main>

<!-- CHECKOUT BAR -->
<div class="checkout-bar" id="checkoutBar">
  <div class="cb-total"><span>الإجمالي</span><b id="barTotal">0₪</b></div>
  <button class="btn btn-primary" id="checkoutBtn" style="flex:1;">إتمام الطلب ←</button>
</div>

<script>
  // ===== STATE (in-memory only) =====
  let cart = [
    {id:1, store:'تك زون', em:'🎧', name:'سماعة لاسلكية عالية الجودة', variant:'أسود', price:145, old:190, qty:1},
    {id:2, store:'تك زون', em:'⌚', name:'ساعة ذكية بشاشة لمس', variant:'رمادي فضائي', price:340, old:420, qty:1},
    {id:3, store:'ستايل هب', em:'👟', name:'حذاء رياضي مريح للمشي اليومي', variant:'مقاس 42', price:220, old:280, qty:2},
    {id:4, store:'ترافل جو', em:'🎒', name:'حقيبة ظهر مقاومة للماء', variant:'أزرق داكن', price:95, old:null, qty:1}
  ];
  let saved = [
    {id:5, store:'بيوتي لاين', em:'🧴', name:'مجموعة عناية بالبشرة طبيعية', price:130}
  ];
  const DELIVERY_FEE = 15;
  let promo = null; // {code, percent}

  const fmt = n => `${n.toLocaleString('ar')}₪`;

  function groupByStore(items){
    const groups = {};
    items.forEach(it => { (groups[it.store] ||= []).push(it); });
    return groups;
  }

  function render(){
    const content = document.getElementById('cartContent');
    const emptyState = document.getElementById('emptyState');
    const summaryBox = document.getElementById('summaryBox');
    const checkoutBar = document.getElementById('checkoutBar');
    const promoBox = document.querySelector('.promo-box');
    const savedToggle = document.getElementById('savedToggle');
    const savedList = document.getElementById('savedList');

    // clear existing store groups
    document.querySelectorAll('.store-group').forEach(el => el.remove());

    document.getElementById('itemCountLabel').textContent = `${cart.reduce((s,i)=>s+i.qty,0)} منتج`;

    if(cart.length === 0){
      emptyState.style.display = 'flex';
      summaryBox.style.display = 'none';
      checkoutBar.style.display = 'none';
      promoBox.style.display = 'none';
      document.getElementById('promoMsg').style.display = 'none';
    } else {
      emptyState.style.display = 'none';
      summaryBox.style.display = 'block';
      checkoutBar.style.display = 'flex';
      promoBox.style.display = 'flex';

      const groups = groupByStore(cart);
      const frag = document.createDocumentFragment();
      Object.entries(groups).forEach(([store, items]) => {
        const group = document.createElement('div');
        group.className = 'store-group';
        group.innerHTML = `
          <div class="store-head"><span class="em">🏪</span><h3>${store}</h3><span>${items.length} منتج</span></div>
          ${items.map(it => `
            <div class="cart-item" data-id="${it.id}">
              <div class="ci-media">${it.em}</div>
              <div class="ci-body">
                <div class="ci-name">${it.name}</div>
                <div class="ci-variant">${it.variant}</div>
                <div class="ci-row">
                  <div><span class="ci-price">${fmt(it.price)}</span>${it.old ? `<span class="ci-old">${fmt(it.old)}</span>` : ''}</div>
                  <div class="stepper">
                    <button data-action="dec" data-id="${it.id}" aria-label="إنقاص">−</button>
                    <span class="qty">${it.qty}</span>
                    <button data-action="inc" data-id="${it.id}" aria-label="زيادة">+</button>
                  </div>
                </div>
              </div>
              <div class="ci-actions">
                <button class="ci-remove" data-action="remove" data-id="${it.id}" aria-label="حذف">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
                </button>
                <button class="ci-save" data-action="save" data-id="${it.id}">حفظ لاحقًا</button>
              </div>
            </div>
          `).join('')}
        `;
        frag.appendChild(group);
      });
      content.insertBefore(frag, savedToggle);
    }

    // saved for later
    document.getElementById('savedCount').textContent = saved.length;
    savedToggle.style.display = saved.length ? 'flex' : 'none';
    savedList.innerHTML = saved.map(it => `
      <div class="saved-item" data-id="${it.id}">
        <div class="ci-media">${it.em}</div>
        <div class="ci-body">
          <div class="ci-name">${it.name}</div>
          <div class="ci-price">${fmt(it.price)}</div>
        </div>
        <button class="saved-restore" data-action="restore" data-id="${it.id}">استعادة</button>
      </div>
    `).join('');

    calcSummary();
  }

  function calcSummary(){
    const subtotal = cart.reduce((s,i) => s + i.price * i.qty, 0);
    const delivery = cart.length ? DELIVERY_FEE : 0;
    let discount = 0;
    if(promo) discount = Math.round(subtotal * promo.percent / 100);
    const total = subtotal + delivery - discount;

    document.getElementById('sumSubtotal').textContent = fmt(subtotal);
    document.getElementById('sumDelivery').textContent = subtotal ? fmt(delivery) : '0₪';
    const discRow = document.getElementById('sumDiscountRow');
    if(discount > 0){
      discRow.style.display = 'flex';
      document.getElementById('sumDiscount').textContent = `-${fmt(discount)}`;
    } else {
      discRow.style.display = 'none';
    }
    document.getElementById('sumTotal').textContent = fmt(total);
    document.getElementById('barTotal').textContent = fmt(total);
  }

  // ===== EVENT DELEGATION =====
  document.getElementById('cartContent').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = Number(btn.dataset.id);
    const action = btn.dataset.action;
    const item = cart.find(i => i.id === id);

    if(action === 'inc' && item){ item.qty++; render(); }
    if(action === 'dec' && item){
      item.qty--;
      if(item.qty <= 0){ cart = cart.filter(i => i.id !== id); }
      render();
    }
    if(action === 'remove' && item){
      const el = btn.closest('.cart-item');
      el.classList.add('removing');
      setTimeout(() => { cart = cart.filter(i => i.id !== id); render(); }, 200);
    }
    if(action === 'save' && item){
      saved.push({id:item.id, store:item.store, em:item.em, name:item.name, price:item.price});
      cart = cart.filter(i => i.id !== id);
      render();
    }
    if(action === 'restore'){
      const sItem = saved.find(i => i.id === id);
      if(sItem){
        cart.push({...sItem, variant:'قياسي', old:null, qty:1});
        saved = saved.filter(i => i.id !== id);
        render();
      }
    }
  });

  document.getElementById('savedToggle').addEventListener('click', function(){
    this.classList.toggle('open');
    document.getElementById('savedList').classList.toggle('open');
  });

  document.getElementById('clearCartBtn').addEventListener('click', () => {
    if(cart.length === 0) return;
    cart = [];
    render();
  });

  document.getElementById('promoApplyBtn').addEventListener('click', () => {
    const val = document.getElementById('promoInput').value.trim().toUpperCase();
    const msg = document.getElementById('promoMsg');
    if(!val){ return; }
    if(val === 'SPEED10'){
      promo = {code:val, percent:10};
      msg.textContent = '✓ تم تطبيق كود الخصم — وفّرت 10%';
      msg.className = 'promo-msg ok';
    } else {
      promo = null;
      msg.textContent = '✕ الكود غير صالح أو منتهي الصلاحية';
      msg.className = 'promo-msg err';
    }
    calcSummary();
  });

  document.getElementById('checkoutBtn').addEventListener('click', () => {
    if(cart.length === 0) return;
    mGoTo('checkout.html');
  });

  render();
</script>
<script>
  (function(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      var next = isLight ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try{ localStorage.setItem('speedShopTheme', next); }catch(e){}
    });
  })();
</script>
<script>
(function(){
  // Enables :active styles to fire reliably on iOS Safari
  document.addEventListener('touchstart', function(){}, {passive:true});

  // Scroll-reveal: adds directional variety + per-group stagger to cards/sections
  // (down for headings, left/right for paired cards, up for the rest), plus a
  // gentle pop-in for icons inside them. Also covers elements already tagged
  // with .reveal/.m-reveal so the whole page stays visually consistent.
  var sel = '.order-card, .addr-card, .rp-card, .why-card, .t-card, .fav-card, .rider-card, .map-card, .stat-card, .section, .cart-item, .saved-item, .page-title, .p-title, .section-head, .section-label, .hero, .hero-stats, .stats-row, .cat-card, .p-card, .offer-band';
  var downSel = '.section-head, .section-label, .page-title, .p-title';
  var sideSel = '.addr-card, .rp-card, .rider-card, .map-card, .fav-card';
  var iconHostSel = '.why-card, .cat-card, .t-card, .stat-card';
  var all = Array.prototype.slice.call(document.querySelectorAll(sel));
  if('IntersectionObserver' in window && all.length){
    var parentIdx = new Map();
    var parentSide = new Map();
    all.forEach(function(el){
      if(!el.classList.contains('reveal') && !el.classList.contains('m-reveal')){
        el.classList.add('m-reveal');
      }
      if(el.matches(downSel)){
        el.classList.add('m-reveal-d');
      } else if(el.matches(sideSel)){
        var side = parentSide.get(el.parentElement) || 0;
        el.classList.add(side % 2 === 0 ? 'm-reveal-r' : 'm-reveal-l');
        parentSide.set(el.parentElement, side + 1);
      }
      var idx = parentIdx.get(el.parentElement) || 0;
      el.style.transitionDelay = (Math.min(idx, 5) * 100) + 'ms';
      parentIdx.set(el.parentElement, idx + 1);
    });
    var mio = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          e.target.classList.add('in');
          mio.unobserve(e.target);
        }
      });
    }, {threshold:0.12});
    all.forEach(function(el){ mio.observe(el); });

    var icons = [];
    all.forEach(function(el){
      if(el.matches(iconHostSel)){
        var em = el.querySelector('.em');
        if(em) icons.push(em);
      }
    });
    icons.forEach(function(el, i){
      el.classList.add('m-icon-pop');
      el.style.transitionDelay = (Math.min(i % 6, 5) * 100 + 80) + 'ms';
      mio.observe(el);
    });
  }
})();
</script>
<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bar = document.createElement('div');
  bar.className = 'm-loadbar';
  document.body.appendChild(bar);

  // Shared helper so JS-triggered redirects (buy now, checkout, logout...) use the
  // same soft fade + loading cue as normal link navigation.
  window.mGoTo = function(href, delay){
    if(!href) return;
    bar.classList.remove('done');
    void bar.offsetWidth;
    bar.classList.add('show');
    if(reduceMotion){ window.location.href = href; return; }
    document.body.classList.add('m-page-exit');
    setTimeout(function(){ window.location.href = href; }, delay || 180);
  };

  // Intercept clicks on internal .html links to play a light fade-out before leaving.
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var href = a.getAttribute('href');
    if(!href || href.charAt(0) === '#' || a.target === '_blank' || a.hasAttribute('download')) return;
    if(/^([a-z]+:)?\/\//i.test(href) || /^(tel|sms|mailto|whatsapp):/i.test(href)) return;
    if(href.indexOf('.html') === -1) return;
    e.preventDefault();
    window.mGoTo(href);
  }, true);
})();
</script>
<script>
(function(){
  // Scroll progress bar
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var track = document.createElement('div');
  track.className = 'm-scrollbar';
  var fill = document.createElement('div');
  fill.className = 'm-scrollbar-fill';
  track.appendChild(fill);
  document.body.appendChild(track);
  var ticking = false;
  function updateProgress(){
    var doc = document.documentElement;
    var max = doc.scrollHeight - doc.clientHeight;
    var pct = max > 0 ? Math.min(1, Math.max(0, doc.scrollTop / max)) : 0;
    fill.style.transform = 'scaleX(' + pct + ')';
    ticking = false;
  }
  window.addEventListener('scroll', function(){
    if(!ticking){ requestAnimationFrame(updateProgress); ticking = true; }
  }, {passive:true});
  updateProgress();

  // Hero parallax: only runs while the hero is near the viewport, and skipped
  // entirely on reduced-motion or small/touch screens to keep things light.
  var hero = document.querySelector('.hero');
  var isSmall = window.matchMedia('(max-width:640px)').matches;
  if(hero && !reduceMotion && !isSmall && 'IntersectionObserver' in window){
    var active = false;
    function updateParallax(){
      var rect = hero.getBoundingClientRect();
      var mid = rect.top + rect.height / 2 - window.innerHeight / 2;
      var pz = Math.max(-24, Math.min(24, mid * -0.06));
      hero.style.setProperty('--pz', pz + 'px');
      if(active) requestAnimationFrame(updateParallax);
    }
    var hio = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting && !active){
          active = true;
          requestAnimationFrame(updateParallax);
        } else if(!e.isIntersecting){
          active = false;
        }
      });
    });
    hio.observe(hero);
  }
})();
</script>
